ramon-saved-searches:
  admin:
    permissions:
      use_label: Salvar buscas e ser avisado de novos resultados
    settings:
      max_per_user_label: Buscas salvas por membro
      max_per_user_help: Quantas buscas cada membro pode salvar. As buscas salvas rodam a cada 5 minutos pelo agendador, então o cron do servidor precisa rodar `php flarum schedule:run`.

  forum:
    frequencies:
      immediately: Assim que possível
      hourly: A cada hora
      daily: Diariamente
      weekly: Semanalmente
    notifications:
      single_text: "Novo resultado para “{query}”: {title}"
      multiple_text: "{count} novos resultados para “{query}”"
    save_search:
      button: Salvar busca
      saved_message: Busca salva. Você será avisado dos novos resultados.
      manage_link: Gerenciar
    settings:
      heading: Buscas salvas
      help: Seja avisado quando novas discussões ou respostas combinarem com uma busca. Funciona como a busca do fórum, filtros incluídos.
      empty: Você ainda não salvou nenhuma busca.
      query_label: Busca
      query_placeholder: Palavras ou filtros a buscar
      frequency_label: Com que frequência verificar
      add_button: Salvar
      delete_button: "Apagar a busca salva “{query}”"
      delete_confirm: "Apagar a busca salva “{query}”?"
      limit_reached: "Você chegou ao limite de {max} buscas salvas. Apague uma para salvar outra."
      notify_label: Algo novo combina com uma das minhas buscas salvas

  api:
    limit_reached: "Você pode salvar até {max} buscas."
    already_saved: Você já salvou esta busca.
    invalid_filters: Esta busca não pode ser salva.

  email:
    subject: "[Busca salva] Novos resultados para “{query}”"
    plain:
      body: |
        Há {count} novos resultados para a sua busca salva “{query}”. O mais recente está em: {title}

        {discussion_url}

        Ver todos os resultados:
        {search_url}

        Você pode mudar a frequência dos avisos, ou apagar esta busca, nas suas configurações.
    html:
      body: |
        Há {count} novos resultados para a sua busca salva “{query}”. O mais recente está em [{title}]({discussion_url}).

        [Ver todos os resultados]({search_url}). Você pode mudar a frequência dos avisos, ou apagar esta busca, nas suas configurações.

  lib:
    gdpr:
      export_description: As buscas que você salvou e com que frequência rodam.
      anonymize_description: As suas buscas salvas são apagadas.
      delete_description: As suas buscas salvas são apagadas.
